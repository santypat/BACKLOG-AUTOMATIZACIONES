services:
  - type: web
    name: backlog-automatizaciones
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
